<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Connection Engine Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    input, button {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      font-size: 0.9rem;
    }
    
    input {
      flex: 1;
      min-width: 300px;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .section {
      margin-bottom: 2rem;
    }
    
    .section h2 {
      color: #333;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .card {
      background: #fafafa;
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .card-content {
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    
    .card-id {
      font-size: 0.7rem;
      color: #999;
      font-family: monospace;
    }
    
    .suggestion {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      border: 2px solid #e0e0e0;
    }
    
    .suggestion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .confidence {
      background: #667eea;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    .confidence.high { background: #10b981; }
    .confidence.medium { background: #f59e0b; }
    .confidence.low { background: #667eea; }
    
    .connection-arrow {
      font-size: 1.5rem;
      color: #667eea;
      text-align: center;
      margin: 0.5rem 0;
    }
    
    .reason {
      background: white;
      padding: 0.75rem;
      border-radius: 8px;
      font-style: italic;
      color: #555;
      margin-bottom: 1rem;
    }
    
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .btn-accept {
      background: #10b981;
    }
    
    .btn-accept:hover {
      background: #059669;
    }
    
    .btn-reject {
      background: #ef4444;
    }
    
    .btn-reject:hover {
      background: #dc2626;
    }
    
    .connection-item {
      background: #f0fdf4;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border-left: 4px solid #10b981;
    }
    
    .connection-item.manual {
      background: #fef3c7;
      border-left-color: #f59e0b;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }
    
    .error {
      background: #fee;
      color: #c00;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .success {
      background: #efe;
      color: #070;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 Auto-Connection Engine Test</h1>
    <p class="subtitle">Story 6.2 - Epic 6: Connections & Relationships</p>
    
    <div class="controls">
      <input 
        type="text" 
        id="boardId" 
        placeholder="Board ID (e.g., f9ded4ca-834f-4254-984c-8eab64ad27ae)"
        value="f9ded4ca-834f-4254-984c-8eab64ad27ae"
      >
      <button onclick="loadBoard()">🔄 Load Board</button>
      <button onclick="findConnections()">🔍 Find Connections</button>
    </div>
    
    <div id="message"></div>
    
    <div class="section">
      <h2>📝 Cards on Board</h2>
      <div id="cards" class="card-grid">
        <div class="loading">Enter a board ID and click "Load Board"</div>
      </div>
    </div>
    
    <div class="section">
      <h2>💡 Connection Suggestions</h2>
      <div id="suggestions">
        <div class="loading">Click "Find Connections" to see suggestions</div>
      </div>
    </div>
    
    <div class="section">
      <h2>✅ Existing Connections</h2>
      <div id="connections">
        <div class="loading">Load a board to see existing connections</div>
      </div>
    </div>
  </div>
  
  <script>
    const API_URL = 'http://localhost:3000';
    let currentBoardId = '';
    let cardsData = [];
    
    function showMessage(text, type = 'success') {
      const msg = document.getElementById('message');
      msg.innerHTML = `<div class="${type}">${text}</div>`;
      setTimeout(() => msg.innerHTML = '', 3000);
    }
    
    async function loadBoard() {
      const boardId = document.getElementById('boardId').value;
      if (!boardId) {
        showMessage('Please enter a board ID', 'error');
        return;
      }
      
      currentBoardId = boardId;
      
      try {
        document.getElementById('cards').innerHTML = '<div class="loading">Loading cards...</div>';
        
        const response = await fetch(`${API_URL}/api/notes/board/${boardId}`);
        const data = await response.json();
        cardsData = data.data;
        
        if (cardsData.length === 0) {
          document.getElementById('cards').innerHTML = '<div class="loading">No cards found on this board</div>';
          return;
        }
        
        document.getElementById('cards').innerHTML = cardsData.map(card => `
          <div class="card">
            <div class="card-content">${card.content || '(empty card)'}</div>
            <div class="card-id">ID: ${card.id.slice(0, 8)}...</div>
          </div>
        `).join('');
        
        showMessage(`✓ Loaded ${cardsData.length} cards`, 'success');
        
        // Also load existing connections
        loadConnections();
        
      } catch (error) {
        document.getElementById('cards').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }
    
    async function findConnections() {
      if (!currentBoardId) {
        showMessage('Please load a board first', 'error');
        return;
      }
      
      try {
        document.getElementById('suggestions').innerHTML = '<div class="loading">Finding connections...</div>';
        
        const response = await fetch(`${API_URL}/api/boards/${currentBoardId}/connections/suggest?minConfidence=0.1`);
        const data = await response.json();
        
        if (data.count === 0) {
          document.getElementById('suggestions').innerHTML = '<div class="loading">No suggestions found. Cards may not have enough common keywords.</div>';
          return;
        }
        
        document.getElementById('suggestions').innerHTML = data.data.map((suggestion, index) => {
          const confidencePercent = Math.round(suggestion.confidence * 100);
          const confidenceClass = confidencePercent >= 30 ? 'high' : confidencePercent >= 15 ? 'medium' : 'low';
          
          return `
            <div class="suggestion">
              <div class="suggestion-header">
                <strong>Suggestion ${index + 1}</strong>
                <span class="confidence ${confidenceClass}">${confidencePercent}% confident</span>
              </div>
              
              <div class="card">
                <div class="card-content">${suggestion.sourceCard.content}</div>
              </div>
              
              <div class="connection-arrow">↓</div>
              
              <div class="card">
                <div class="card-content">${suggestion.targetCard.content}</div>
              </div>
              
              <div class="reason">💡 ${suggestion.reason}</div>
              
              <div class="actions">
                <button class="btn-accept" onclick="acceptSuggestion('${suggestion.sourceCardId}', '${suggestion.targetCardId}', ${suggestion.confidence}, '${suggestion.reason}')">
                  ✓ Accept
                </button>
                <button class="btn-reject" onclick="rejectSuggestion(${index})">
                  ✗ Reject
                </button>
              </div>
            </div>
          `;
        }).join('');
        
        showMessage(`✓ Found ${data.count} connection suggestions`, 'success');
        
      } catch (error) {
        document.getElementById('suggestions').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }
    
    async function acceptSuggestion(sourceId, targetId, confidence, reason) {
      try {
        const response = await fetch(`${API_URL}/api/boards/${currentBoardId}/connections`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sourceCardId: sourceId,
            targetCardId: targetId,
            confidence: confidence,
            reason: reason,
            isAutoGenerated: true
          })
        });
        
        if (!response.ok) {
          const error = await response.json();
          showMessage(`Error: ${error.error.message}`, 'error');
          return;
        }
        
        showMessage('✓ Connection created!', 'success');
        
        // Refresh connections and suggestions
        loadConnections();
        findConnections();
        
      } catch (error) {
        showMessage(`Error: ${error.message}`, 'error');
      }
    }
    
    function rejectSuggestion(index) {
      showMessage('✓ Suggestion rejected', 'success');
      // In a real app, you might want to store rejections
      findConnections(); // Refresh suggestions
    }
    
    async function loadConnections() {
      if (!currentBoardId) return;
      
      try {
        const response = await fetch(`${API_URL}/api/boards/${currentBoardId}/connections`);
        const data = await response.json();
        
        if (data.data.length === 0) {
          document.getElementById('connections').innerHTML = '<div class="loading">No connections yet. Accept a suggestion to create one!</div>';
          return;
        }
        
        document.getElementById('connections').innerHTML = data.data.map(conn => {
          const isAuto = conn.isAutoGenerated;
          return `
            <div class="connection-item ${isAuto ? '' : 'manual'}">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                <strong>${isAuto ? '🤖 Auto-generated' : '👤 Manual'}</strong>
                ${conn.confidence ? `<span class="confidence">${Math.round(conn.confidence * 100)}%</span>` : ''}
              </div>
              <div style="font-size: 0.9rem; margin-bottom: 0.5rem;">
                "${conn.sourceCard.content.slice(0, 40)}..." → "${conn.targetCard.content.slice(0, 40)}..."
              </div>
              ${conn.reason ? `<div style="font-size: 0.8rem; color: #666; font-style: italic;">💡 ${conn.reason}</div>` : ''}
            </div>
          `;
        }).join('');
        
      } catch (error) {
        document.getElementById('connections').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }
    
    // Load board on page load if boardId is pre-filled
    window.onload = () => {
      const boardId = document.getElementById('boardId').value;
      if (boardId) {
        loadBoard();
      }
    };
  </script>
</body>
</html>
